; Modelines for gud-windows.
;
; Install at C:\ProgramData\gud-windows\modelines.ini
;
; Loaded after the device's own advertised list, so an entry here overrides an
; advertised one with the same geometry and refresh. Someone who wrote out a
; modeline meant it.
;
; X11 and Switchres spelling: clock in MHz, then hdisplay hsync_start hsync_end
; htotal vdisplay vsync_start vsync_end vtotal, then flags. Recognised flags are
; +hsync -hsync +vsync -vsync interlace doublescan csync preferred. Sync
; polarity defaults to negative, which is what 15 kHz RGB and SCART want.
;
; An unrecognised trailing word is refused rather than ignored: a typo in a
; modeline reaches a deflection circuit.
;
; Every line below is a 15 kHz timing. Check the line rate before adding one --
; clock in kHz divided by htotal, and it wants to land in the 15.0 to 16.5 kHz
; band for a standard 15 kHz CRT. 6.700 MHz over an htotal of 480 looks
; plausible and is 13.958 kHz, well under the floor.

[modelines]

; --- 240p, the bulk of the retro catalogue ---
nes_snes_cps  = ModeLine "256x224@60"  5.040 256 264 288 320 224 227 230 262 -hsync -vsync
genesis       = ModeLine "320x224@60"  6.300 320 332 362 400 224 227 230 262 -hsync -vsync
cps2_neogeo   = ModeLine "384x224@60"  7.560 384 400 432 480 224 227 230 262 -hsync -vsync
ntsc_240p     = ModeLine "320x240@60"  6.300 320 332 362 400 240 243 246 262 -hsync -vsync
pal_288p      = ModeLine "320x288@50"  6.250 320 332 362 400 288 291 294 312 -hsync -vsync

; --- 480i / 576i ---
ntsc_480i     = ModeLine "640x480@60" 12.600 640 664 724 800 480 486 492 525 interlace -hsync -vsync
pal_576i      = ModeLine "640x576@50" 12.500 640 664 724 800 576 582 588 625 interlace -hsync -vsync

; The last two duplicate what the device already advertises, and are here as a
; worked example of the override: edit these and the device's own numbers are
; replaced. Delete them to go back to what the board says.
